[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stanford-wdl-kit"
version = "1.9.7"
description = "A WDL toolkit with a focus on ETL and Cloud integration"
readme = "SUMMARY.md"
license = { text = "Apache License, Version 2.0" }
authors = [
    { name = "Darren Guan", email = "dguan2@stanford.edu" },
    { name = "Joe Mesterhazy", email = "jmesterh@stanford.edu" },
    { name = "Tyler Tollefson", email = "tjt8712@stanford.edu" },
    { name = "Smita Limaye", email = "slimaye@stanford.edu" },
    { name = "Jay Chen", email = "jchen313@stanford.edu" },
]
maintainers = [
    { name = "Research IT: Technology & Digital Solutions, Stanford Medicine", email = "rit-oss-admin@stanford.edu" },
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "miniwdl>=1.13.1",
    "google-cloud-bigquery==3.41.0",
    "google-cloud-storage==3.10.1",
    "pandas==3.0.2",
    "dataclasses-json==0.6.7",
    "pyarrow==23.0.1",
    "PyYAML==6.0.3",
    "slack_sdk==3.41.0",
    "boltons==25.0.0",
    "importlib_metadata==9.0.0",
    "google-api-python-client==2.193.0",
    "oauth2client==4.1.3",
    "pysftp==0.2.9",
    "aiohttp==3.13.5",
    "cryptography~=46.0.0",
    "requests==2.33.1",
    "google-auth==2.49.1",
    "pg8000==1.31.5",
    "SQLAlchemy==2.0.48",
    "cloud-sql-python-connector==1.20.1",
    "pyOpenSSL~=26.0.0",
    "numpy==2.4.4",
]

[project.scripts]
wbq = "gcp.bigquery:main"
wgcs = "gcp.gcs:main"
csql = "gcp.cloudsql:main"
wbr = "utils.backup:main"
yaml2wdl = "utils.yaml2wdl:main"
slacker = "utils.slacker:main"
mailer = "utils.mailer:main"

[project.urls]
Homepage = "https://github.com/susom/wdl-kit"

[dependency-groups]
dev = [
    "bump2version>=1.0.1",
    "twine>=4.0.0",
    "flake8>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/main/python/gcp", "src/main/python/utils"]

[tool.hatch.build.targets.sdist]
include = [
    "src/main/python/",
    "src/main/wdl/",
    "SUMMARY.md",
    "LICENSE",
]
